<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarginGap Extension Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      color: #111827;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    p {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #374151;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover {
      background: #2563eb;
    }
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
    }
    .status.success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #10b981;
    }
    .status.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #ef4444;
    }
    .help-text {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>MarginGap Extension Settings</h1>
  <p>Configure your Supabase credentials to enable price intelligence.</p>
  
  <form id="settings-form">
    <div class="form-group">
      <label for="supabase-url">Supabase URL</label>
      <input 
        type="url" 
        id="supabase-url" 
        placeholder="https://your-project.supabase.co"
        required
      />
      <div class="help-text">Your Supabase project URL</div>
    </div>
    
    <div class="form-group">
      <label for="supabase-key">Supabase Anon Key</label>
      <input 
        type="text" 
        id="supabase-key" 
        placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        required
      />
      <div class="help-text">Your Supabase anonymous/public key</div>
    </div>
    
    <div style="display: flex; gap: 12px; align-items: center;">
      <button type="submit">Save Settings</button>
      <button type="button" id="test-button" style="background: #10b981;">Test Connection</button>
      <span id="config-status" class="config-status" style="margin-left: auto; font-size: 12px; color: #6b7280;"></span>
    </div>
  </form>
  
  <div id="status" class="status"></div>
  
  <style>
    .config-status.configured {
      color: #10b981;
      font-weight: 500;
    }
    #test-button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
  </style>
  
  <script src="options.js"></script>
</body>
</html>
